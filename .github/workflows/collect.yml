name: Refresh lodging availability

# Runs once a day: checks availability, looks for property photos, and commits
# docs/data/ when something changed.
#
# Settings > Secrets and variables > Actions:
#   Variable  LODGING_SOURCES        comma-separated sources to run, e.g. "google_hotels,trmf,airbnb,vrbo,recgov,ndparks"
#   Variable  LODGING_PACE           optional: "light" for fewer checks (see README)
#   Secret    SEARCHAPI_KEY          Google Hotels through SearchApi
#   Secret    GUESTY_CLIENT_ID       Vacation Medora's Guesty Booking Engine API
#   Secret    GUESTY_CLIENT_SECRET
#   Secret    APIFY_TOKEN            Airbnb and Vrbo calendars
#
# A source whose key is missing is skipped. With LODGING_SOURCES unset, the run
# makes no outside requests and only rebuilds the property list.

on:
  schedule:
    - cron: "17 11 * * *"   # about 5:17 a.m. Mountain
  workflow_dispatch:
    inputs:
      full:
        description: "Re-check every night in each source's horizon (slow; use for the first run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # the very first run checks every night and takes about an hour and a half
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Collect
        env:
          LODGING_SOURCES: ${{ vars.LODGING_SOURCES }}
          LODGING_PACE: ${{ vars.LODGING_PACE }}       # "light" checks less often; leave unset for standard
          RECGOV_VIA: ${{ vars.RECGOV_VIA }}           # "direct" asks recreation.gov itself instead of going through Apify
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          GUESTY_CLIENT_ID: ${{ secrets.GUESTY_CLIENT_ID }}
          GUESTY_CLIENT_SECRET: ${{ secrets.GUESTY_CLIENT_SECRET }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python collector/collect.py ${{ inputs.full && '--full' || '' }}
      - name: Find photos
        # Looks at each property's website about once a week. A failure here never blocks the data refresh.
        continue-on-error: true
        env:
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}   # Google Maps fallback only; used when a photo is missing
        run: python collector/photos.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh lodging availability"
            git push
          fi
